<!--

  height 555, or the clip's meta bandHeightPx) while the main timeline slides the take down under it (presenter shift).
  The clip is scaled to its meta `frame` (r3: 1080x1918), its `crop` rows kept, placed at its `anchor` inside the band, and
  moved by its `pan` keyframes (r3's shelf tilts down with the phone) or eased from its `zoom` (r3's tea and pen); it plays
  from its trim in (`mediaStart`). The band enters from y -400 (its first frame already shows) and, when it ends before its
  take's cut, leaves upwards and is hidden just before the host's end; otherwise it ends with the cut.
  Parameters (render_planned.py): id, src, band_h, the clip box, media_start, motion, exit, hold.
-->

__MOTION____EXIT__        tl.set({}, {}, __HOLD__);
